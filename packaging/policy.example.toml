# dd-worker host policy. Copy to /etc/dd-worker/policy.toml (root:root 0644)
# and edit. The worker refuses a policy that is not root-owned or is group- or
# world-writable, and declines every job while the file is missing or invalid.
# `dd-worker status` prints how the worker reads it.

# Master switch: false declines every offer.
enabled = true

# Orgs whose jobs this host takes (Defect Drainer org ids). Required.
orgs = ["more-than-code"]

# Coding agents this host runs. pi hosts run Claude with an API key
# (secrets.env). The worker declines grok and antigravity jobs: those CLIs
# do not enforce the worker's deny lists and egress allowlist yet.
adapters = ["claude"]

# Repos this host may work on. Unset or empty means no repo: the worker
# declines every job until you list the repos here.
# repos = [
#   "https://github.com/more-than-code/example-app",
# ]

# The weakest sandbox a job may ask for: "read-only", "strict" or "workspace".
min_sandbox = "workspace"

# Per-job limits.
max_turns = 80
max_wall_sec = 2700
max_jobs = 1

# Per-job resource limits (cgroup v2; see host-setup, Resource limits). Each
# job's agent, browser, job stack and verify commands share them. Unset:
# memory is 75% of the host's RAM shared by max_jobs, 4096 tasks, no CPU
# quota. Setting any of these makes the worker decline jobs while it can't
# enforce them (for example under an older unit without Delegate=).
# Versions before 0.2.0-rc10 refuse these keys: remove them before a rollback.
# job_memory_max = "3G"
# job_tasks_max = 4096
# job_cpu_percent = 200

# A project's verify commands: "sandbox" (the default) runs them in the
# worker's verify sandbox, with network only to agent_allowed_domains; "off"
# skips them. There is no unsandboxed setting. The older
# allow_verify_commands is deprecated: without verify_commands, false still
# means "off" and true means "sandbox".
# Versions before 0.2.0-rc9 refuse this key: remove it before a rollback.
# verify_commands = "sandbox"

# Push the job branch when the operator ships (serve opens the PR).
allow_ship = true

# Hosts the agent's sandboxed shell may reach (exact lowercase hostnames, at
# most 16, no wildcards or IP addresses). Unset or empty means no network.
# Versions before 0.2.0-rc2 refuse this key: remove it before a rollback.
# agent_allowed_domains = ["registry.npmjs.org"]

# Lower the server's per-job agent cost cap on this host (whole US dollars,
# 1 to 100). Unset uses the server's cap, or $5 when the server sends none.
# Versions before 0.2.0-rc2 refuse this key: remove it before a rollback.
# max_cost_usd = 5

# Headless browser for after-fix screenshots: an absolute path to a root-owned
# executable that only root can write. Unset or empty means no browser jobs.
# Setting it also lets a browser job's sandbox use unix sockets; the worker
# hides every host socket it could reach (see host-setup, After-fix
# screenshots). Upgrade the control plane first.
# Versions before 0.2.0-rc3 refuse this key: remove it before a rollback.
# agent_browser = "/usr/bin/chromium"

# More paths to hide from a browser job's sandbox, beyond the sockets the
# worker finds (absolute paths, at most 32).
# Versions before 0.2.0-rc3 refuse this key: remove it before a rollback.
# agent_deny_sockets = ["/run/example"]

# Models a job may run on: aliases ("sonnet", "opus", "haiku") or full ids,
# matched exactly, case-sensitive (an alias does not cover a full id), at most 16. A job for
# another model is declined model_not_allowed and waits for another worker.
# A Claude job that names no model (the CLI's default) is declined too.
# Unset means any model.
# Versions before 0.2.0-rc4 refuse this key: remove it before a rollback.
# allowed_models = ["sonnet", "haiku"]

# Postgres server binaries for an app's job stack: an absolute path to a
# root-owned directory, not group- or world-writable, holding initdb, pg_ctl
# and postgres, each root's alone. Unset or empty means no jobs whose preview
# services need Postgres. dd-stack runs them inside a browser job's sandbox;
# disable the distro's own Postgres service (see host-setup, Job stack).
# Upgrade the control plane first.
# Versions before 0.2.0-rc6 refuse this key: remove it before a rollback.
# agent_postgres = "/usr/lib/postgresql/15/bin"

# Where this file is edited when a host manager such as Deploybot owns it:
# an https URL, at most 512 characters, no user or password. The console
# links to it ("Managed in Deploybot -> Edit"); unset means edited on the host.
# Versions before 0.2.0-rc6 refuse this key: remove it before a rollback.
# managed_url = "https://deploybot.example.com/hosts/<host>/files/policy"

# Self-update (see host-setup, Self-update): "server" follows the server's
# target release by itself; "off" (the default) never updates. Only a newer
# version within the same minor (0.2.x), signed with the release key
# compiled into dd-worker, from the project's GitHub releases. Running jobs
# finish first; a version that does not come up is rolled back.
# Versions before 0.2.0-rc10 refuse these keys: remove them before a rollback.
# auto_update = "server"
# Only start an update in this local-time window (HH:MM-HH:MM, may wrap
# midnight). Unset: any time.
# auto_update_window = "02:00-05:00"
# The only proxy the update download may use (http(s)://host:port).
# auto_update_https_proxy = "http://proxy.example:3128"
